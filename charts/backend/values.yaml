replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  tag: 1.27-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # Keep this above 1024. The image runs as a non-root user and cannot bind a
  # privileged port.
  port: 8080

backend:
  # The shared API token this backend accepts. Supplied by the Stack from the
  # `credentials` task's captured output, so there is no useful default: the
  # chart fails rather than starting a backend that trusts an empty token.
  token: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
fullnameOverride: ""
