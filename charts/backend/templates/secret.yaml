{{- if not .Values.backend.token }}
{{- fail "backend.token is required: the Stack supplies it from the credentials task's token output" }}
{{- end }}
# The served config lives in a Secret rather than a ConfigMap because it carries
# the API token. The token arrived here through the Stack: the `credentials`
# task generated it, the Stack captured it with a fromSecret output, and the
# ArgoCDApplicationTemplate rendered it into this chart's values.
#
# /healthz is deliberately left open so the probes do not need the token.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  default.conf: |
    server {
      listen {{ .Values.service.port }};

      location = /healthz {
        access_log off;
        return 200 'ok';
      }

      location / {
        if ($http_x_api_token != '{{ .Values.backend.token }}') {
          return 401;
        }
        default_type application/json;
        return 200 '{"service":"backend","message":"hello from the backend"}';
      }
    }
