# The identity the API token belongs to. It must exist before the token Secret
# below, or the token controller deletes that Secret instead of filling it.
#
# Helm's own install order already puts ServiceAccount ahead of Secret. Argo CD
# sorts Secret first, so the sync wave is what orders them there. This is the
# in-Application equivalent of the Stack's dependsOn between Applications.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
