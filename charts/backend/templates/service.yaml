# The Stack captures this Service's cluster IP with a fromResource output. The
# address is assigned by the cluster at create time, so it is the clearest case
# of a value that has to be captured rather than configured.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "backend.selectorLabels" . | nindent 4 }}
