# The API token the frontend authenticates with.
#
# This manifest carries no data block on purpose. Kubernetes' token controller
# fills data.token once the Secret exists, so the value is created by the
# cluster rather than by whoever installed the chart. That is exactly the case
# the Stack's fromSecret output is for: the token cannot be passed in as a
# parameter because nobody knows it until the backend has deployed.
#
# Leaving data out also keeps Argo CD from fighting the token controller. Argo
# compares the fields the manifest declares, so a generated value it never
# declared is left alone on every subsequent sync. A chart that generated the
# token itself with randAlphaNum would rotate it on every sync instead, because
# Argo CD renders manifests client-side with no cluster access and therefore no
# way to look up what is already there.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tokenSecret.name }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "backend.fullname" . }}
    argocd.argoproj.io/sync-wave: "0"
type: kubernetes.io/service-account-token
