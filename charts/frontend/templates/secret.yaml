{{- if not .Values.backend.url }}
{{- fail "backend.url is required: the Stack supplies it from the backend task's endpoint output" }}
{{- end }}
{{- if not .Values.backend.token }}
{{- fail "backend.token is required: the Stack supplies it from the backend task's token output" }}
{{- end }}
# The proxy config lives in a Secret rather than a ConfigMap because it carries
# the backend API token. Both values reached this chart through the Stack: the
# backend task's endpoint and token outputs became task parameters, which the
# ArgoCDApplicationTemplate rendered into Helm values, which arrive here as
# .Values.backend.url and .Values.backend.token.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
type: Opaque
stringData:
  default.conf: |
    server {
      listen {{ .Values.service.port }};

      location = /healthz {
        access_log off;
        return 200 'ok';
      }

      location /api/ {
        proxy_pass {{ .Values.backend.url }}/;
        proxy_set_header X-Api-Token '{{ .Values.backend.token }}';
      }

      location / {
        default_type text/plain;
        return 200 'frontend ok';
      }
    }
