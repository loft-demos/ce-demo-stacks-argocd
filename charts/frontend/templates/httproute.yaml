{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.gateway.name }}
{{- fail "httpRoute.gateway.name is required when httpRoute.enabled is true" }}
{{- end }}
# Exposes the frontend through a Gateway that lives in the control plane cluster.
#
# Nothing here is vCluster-specific: it is an ordinary HTTPRoute, created in the
# tenant cluster, pointing at a Gateway the tenant can see. What makes it work is
# the tenant cluster's sync config:
#
#   sync.fromHost.gateways  mirrors the control plane Gateway into this tenant,
#                           read-only, at the namespace/name the mapping gives it
#   sync.toHost.gatewayApi.httpRoutes
#                           syncs this route out to the tenant's host namespace,
#                           rewriting parentRefs back to the real control plane
#                           Gateway and backendRefs to the synced Services
#
# So the route is authored against the tenant-facing mirror and served by the
# shared Gateway. The tenant never creates a Gateway of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name }}
      # The namespace the Gateway is mirrored into, not the one it really lives
      # in. Omit it only when the mirror lands in this release's namespace.
      {{- with .Values.httpRoute.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
      # Name the rule. Do not remove this.
      #
      # When the tenant cluster can sleep, the Platform agent adds a RequestMirror
      # filter to the *host* copy of this route so traffic through it refreshes the
      # last-activity timestamp. If the rule is unnamed, the agent stamps a
      # generated name onto the host rule, and vCluster's sync then rewrites the
      # host spec from this (still unnamed) rule and strips that name straight back
      # off. The two controllers rewrite each other forever: the host generation
      # climbs, the syncer reports "the object has been modified", and the Argo CD
      # Application never leaves Progressing.
      #
      # With an explicit name, vCluster correlates host and tenant rules by name
      # instead of by position, the agent has nothing left to stamp, and both sides
      # converge on the first pass.
    - name: default
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "frontend.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
