replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  tag: 1.27-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # Keep this above 1024. The image runs as a non-root user and cannot bind a
  # privileged port.
  port: 8080

# Both of these are supplied by the Stack from the backend task's captured
# outputs, so they have no useful default. The chart fails fast rather than
# installing a frontend that points nowhere.
backend:
  # e.g. http://10.96.0.42:8080 - the backend Service's cluster IP.
  url: ""
  # The API token the backend's Secret holds.
  token: ""

# Exposes the frontend through a Gateway in the control plane cluster, using
# vCluster's Gateway API sync. Off by default: it needs the tenant cluster to be
# configured with sync.fromHost.gateways and sync.toHost.gatewayApi.httpRoutes,
# and a Gateway on the control plane cluster to attach to.
httpRoute:
  enabled: false
  gateway:
    # Name and namespace as the Gateway appears *inside the tenant cluster*,
    # which is what sync.fromHost.gateways.mappings.byName decides.
    name: shared-gateway
    namespace: gateway-system
    # Optional listener name, when the Gateway has more than one.
    sectionName: ""
  # Optional. Leave empty to serve on every hostname the listener accepts.
  hostnames: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
fullnameOverride: ""
