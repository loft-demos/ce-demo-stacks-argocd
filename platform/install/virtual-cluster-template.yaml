# Install path B: every tenant cluster created from this template gets its own
# StackInstance, owned by the tenant cluster and deleted with it.
---
# Install path B: declare it in a VirtualClusterTemplate so every tenant cluster
# created from the template gets its own StackInstance, owned by the tenant
# cluster and deleted with it.
#
# An Argo CD task on this path is held as StackBlocked unless integrations.argoCD
# is enabled with a connector in the SAME vcluster.yaml. Watch the StacksSynced
# condition on the VirtualClusterInstance: a blocked entry produces no
# StackInstance object at all, so there is nothing for kubectl to show.
#
# A deploy.stacks entry always targets the tenant cluster itself, always inherits
# the tenant cluster's owner, and has no owner or access field. The subtree is
# parsed strictly, so a misspelled field here is an error rather than a silently
# dropped value.
apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: stacks-demo-app-tenant
spec:
  displayName: Shared Nodes tenant cluster with the Stacks demo app
  parameters:
    - variable: repoURL
      label: Git repository URL
      type: string
      required: true
    - variable: hostname
      label: Frontend hostname
      description: Must resolve to the shared Gateway's address, and be accepted by its listener.
      type: string
      required: true
    # Optional overrides. Left empty, the StackTemplate's own defaults apply
    # (shared-gateway / gateway-system / no section pin).
    - variable: gatewayName
      label: Gateway name, as mirrored into the tenant
      type: string
      defaultValue: ""
    - variable: gatewayNamespace
      label: Gateway namespace, as mirrored into the tenant
      type: string
      defaultValue: ""
    - variable: gatewaySectionName
      label: Gateway listener name
      description: >-
        Pins the route to one listener. Worth setting on a Gateway with
        overlapping wildcard hostnames, where which listener serves a request
        otherwise shifts as listeners are added.
      type: string
      defaultValue: ""
  template:
    pro:
      enabled: true
    helmRelease:
      chart:
        name: vcluster
        repo: https://charts.loft.sh
        version: "0.37.1"
      values: |-
        integrations:
          argoCD:
            enabled: true
            connector: my-argocd-connector

        deploy:
          stacks:
            - name: demo-app
              displayName: Demo app
              templateRef:
                name: demo-backend-frontend
              parameters:
                repoURL: "{{ .Values.repoURL }}"
                targetRevision: main
                exposeThroughGateway: "true"
                hostname: "{{ .Values.hostname }}"
                {{- if .Values.gatewayName }}
                gatewayName: "{{ .Values.gatewayName }}"
                {{- end }}
                {{- if .Values.gatewayNamespace }}
                gatewayNamespace: "{{ .Values.gatewayNamespace }}"
                {{- end }}
                {{- if .Values.gatewaySectionName }}
                gatewaySectionName: "{{ .Values.gatewaySectionName }}"
                {{- end }}
              defaults:
                taskTimeout: 10m
              prunePolicy: Prune

        # Gateway API sync. This is what lets the tenant's HTTPRoute be served by
        # a Gateway that lives in the control plane cluster, without the tenant
        # running a Gateway or a controller of its own.
        sync:
          fromHost:
            # The mirrored Gateway names a GatewayClass; import the classes too
            # so the tenant-facing copy resolves.
            gatewayClasses:
              enabled: true
            gateways:
              enabled: true
              # control-plane namespace/name : tenant-facing namespace/name.
              # Keeping both sides identical makes the demo easier to follow;
              # they do not have to match. A wildcard key must map to a wildcard
              # target, and the target namespace may not be the vCluster's own
              # host namespace.
              mappings:
                byName:
                  "gateway-system/shared-gateway": "gateway-system/shared-gateway"
              allowedRoutes:
                # Without this the default is Same, and a route in
                # demo-frontend could not attach to a Gateway mirrored into
                # gateway-system.
                defaultVirtualNamespacePolicy:
                  from: All
              status:
                # Surface the Gateway's address inside the tenant, so
                # `kubectl get gateway -n gateway-system` shows where to point DNS.
                exposeAddresses: true
          toHost:
            # The Gateway routes to the synced Service, so Service sync has to be
            # on for the backendRef to resolve on the control plane cluster.
            services:
              enabled: true
            gatewayApi:
              # Only routes travel outward. Tenants do not create Gateways here,
              # so gateway sync to the control plane cluster stays off.
              httpRoutes:
                enabled: true

        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          coredns:
            enabled: true
            embedded: true
